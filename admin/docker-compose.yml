services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 20.18.0
        VITE_ADMIN_API_URL: https://centralapi.trtelecom.net
    command: npm run start
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ADMIN_API_HOST: 0.0.0.0
      ADMIN_API_PORT: 4050
      ADMIN_PUBLIC_URL: https://centralapi.trtelecom.net
    volumes:
      # Garante que dotenv/MinIO leem o mesmo .env do host
      - ./.env:/app/.env:ro
      # Fotos antigas do PM2
      - ./server/uploads:/app/server/uploads
      - centralapi_data:/app/server/data
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      # API + painel em centralapi.trtelecom.net
      - "traefik.http.routers.centralapi.rule=Host(`centralapi.trtelecom.net`)"
      - "traefik.http.routers.centralapi.entrypoints=websecure"
      - "traefik.http.routers.centralapi.tls=true"
      - "traefik.http.services.centralapi.loadbalancer.server.port=4050"
      # Painel na rota do site institucional: https://trtelecom.net/central-admin-app
      - "traefik.http.routers.centralapi-panel.rule=Host(`trtelecom.net`) && PathPrefix(`/central-admin-app`)"
      - "traefik.http.routers.centralapi-panel.entrypoints=websecure"
      - "traefik.http.routers.centralapi-panel.tls=true"
      - "traefik.http.routers.centralapi-panel.service=centralapi"

volumes:
  centralapi_data:

networks:
  traefik-network:
    external: true
